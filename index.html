<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="description" content="夏名泽 · 个人主页 — 南华大学药学拔尖创新班，阿里云达摩院人工智能高级训练师，专注 AI 应用与跨学科自学。" />
<meta name="theme-color" content="#f1e9d6" />
<title>夏名泽 · 个人主页</title>
<style>
/* ============================================================
   壹 · 设计令牌 —— 青绿山水（《千里江山图》设色）
   石青 · 石绿 · 墨 · 绢白，赭石仅作极少量打底
   ============================================================ */
:root{
  /* 绢本 */
  --paper:#f1e9d6;
  --paper-2:#e9dfc8;
  --card:#fdfaf1;
  --card-2:#f8f3e6;

  /* 墨分五级 */
  --ink-1:#161a1c;
  --ink-2:#2f383c;
  --ink-3:#59656a;
  --ink-4:#889297;
  --ink-5:#b3bbbe;

  /* 石青 */
  --qing:#2b6a8c;
  --qing-deep:#1b4a66;
  --qing-bright:#4d93b8;
  --qing-a07:rgba(43,106,140,.07);
  --qing-a14:rgba(43,106,140,.14);
  --qing-a30:rgba(43,106,140,.30);

  /* 石绿 */
  --lv:#3f7f63;
  --lv-deep:#2a5c47;
  --lv-bright:#67a98a;
  --lv-a10:rgba(63,127,99,.10);
  --lv-a26:rgba(63,127,99,.26);

  /* 赭石（打底，极少量） */
  --zhe:#96733f;

  --line:#d8cdb2;
  --line-soft:#e6dcc6;

  /* 山石设色：石青为顶、石绿为麓 */
  --shA1:#b9cfd9; --shA2:#dde3da;
  --shB1:#84aabd; --shB2:#abc6b6;
  --shC1:#4f8499; --shC2:#70a68b;
  --shD1:#2a6080; --shD2:#3d7c60;
  --shDetail:#1e2a2c;
  --mistCol:#f1e9d6;

  --wash-1:rgba(43,106,140,.10);
  --wash-2:rgba(22,26,28,.05);
  --wash-3:rgba(63,127,99,.085);
  --fibre:rgba(120,105,74,.05);

  /* 云雾（比绢色略亮，方显云气） */
  --fog-a:rgba(248,246,238,.90);
  --fog-b:rgba(243,244,236,.42);
  --fog-global:0;

  /* 背景淡山水透明度 */
  --bd-op:.17;
  --bd-op-d:.15;

  --shadow-sm:0 1px 2px rgba(60,50,30,.06);
  --shadow:0 1px 2px rgba(60,50,30,.05), 0 12px 30px rgba(60,50,30,.08);
  --shadow-lg:0 2px 6px rgba(60,50,30,.07), 0 24px 52px rgba(60,50,30,.14);

  --r-sm:6px; --r:10px; --r-lg:14px;
  --nav-h:66px;
  --ease:cubic-bezier(.22,.68,.36,1);
  --t:210ms;
  --maxw:1120px;

  --serif:"Source Han Serif SC","Noto Serif CJK SC","Songti SC","STSong","SimSun","Microsoft YaHei",Georgia,"Times New Roman",serif;
  --kai:"Kaiti SC","STKaiti","KaiTi","楷体","Source Han Serif SC","Songti SC",serif;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Source Han Sans SC","Noto Sans CJK SC",Roboto,Arial,sans-serif;
}

/* 夜山（深色） */
html[data-theme="dark"]{
  --paper:#0b1014;
  --paper-2:#101820;
  --card:#131b21;
  --card-2:#172129;

  --ink-1:#e6efe9;
  --ink-2:#cfd9d4;
  --ink-3:#9daba6;
  --ink-4:#77847f;
  --ink-5:#4f5a57;

  --qing:#6fb0d4;
  --qing-deep:#4e8cb0;
  --qing-bright:#8cc8e8;
  --qing-a07:rgba(111,176,212,.10);
  --qing-a14:rgba(111,176,212,.20);
  --qing-a30:rgba(111,176,212,.38);

  --lv:#7fc0a2;
  --lv-deep:#5a9c7d;
  --lv-bright:#a2dcc0;
  --lv-a10:rgba(127,192,162,.13);
  --lv-a26:rgba(127,192,162,.32);

  --zhe:#c9a765;

  --line:#2a3540;
  --line-soft:#212c35;

  --shA1:#2c4152; --shA2:#223440;
  --shB1:#24424f; --shB2:#1f3f38;
  --shC1:#1d3f50; --shC2:#1a3f35;
  --shD1:#16333f; --shD2:#14332b;
  --shDetail:#9fc0cb;
  --mistCol:#0b1014;

  --wash-1:rgba(111,176,212,.09);
  --wash-2:rgba(230,239,233,.045);
  --wash-3:rgba(127,192,162,.08);
  --fibre:rgba(255,255,255,.024);

  --fog-a:rgba(52,68,80,.70);
  --fog-b:rgba(38,50,60,.32);

  --shadow-sm:0 1px 2px rgba(0,0,0,.5);
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 14px 34px rgba(0,0,0,.45);
  --shadow-lg:0 2px 8px rgba(0,0,0,.5), 0 28px 62px rgba(0,0,0,.6);
}

/* ============================================================
   贰 · 基础
   ============================================================ */
*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:calc(var(--nav-h) + 20px);-webkit-text-size-adjust:100%}
body{
  margin:0;font-family:var(--sans);font-size:15.6px;line-height:1.82;
  color:var(--ink-2);background:var(--paper);
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  overflow-x:hidden;
  transition:background var(--t) var(--ease),color var(--t) var(--ease);
}
/* 绢本纤维 + 天光地气 */
body::before{
  content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
  background-image:
    repeating-linear-gradient(94deg,var(--fibre) 0 1px,transparent 1px 5px),
    repeating-linear-gradient(4deg,var(--fibre) 0 1px,transparent 1px 7px),
    radial-gradient(120% 80% at 50% -12%,var(--wash-1),transparent 60%),
    radial-gradient(95% 70% at 100% 102%,var(--wash-3),transparent 62%);
  opacity:.92;
}
.wrap{width:100%;max-width:var(--maxw);margin:0 auto;padding:0 26px;position:relative;z-index:1}

/* ============================================================
   贰之附 · 背景淡山水（固定，始终在内容之下）
   ============================================================ */
.backdrop{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.backdrop svg{position:absolute;left:50%;bottom:0;transform:translateX(-50%);width:min(1900px,158vw);height:100vh;opacity:var(--bd-op)}
html[data-theme="dark"] .backdrop svg{opacity:var(--bd-op-d)}

/* ============================================================
   贰之附 · 流动云雾（遮掩下方未至中央的内容，随滚动淡去）
   ============================================================ */
.fogfield{
  position:fixed;left:0;right:0;bottom:0;height:54vh;z-index:4;pointer-events:none;overflow:hidden;
  opacity:var(--fog-global,0);
  -webkit-mask-image:linear-gradient(to bottom,transparent 0,transparent 34%,rgba(0,0,0,.3) 62%,rgba(0,0,0,.78) 86%,#000 100%);
  mask-image:linear-gradient(to bottom,transparent 0,transparent 34%,rgba(0,0,0,.3) 62%,rgba(0,0,0,.78) 86%,#000 100%);
}
.fogfield i{
  position:absolute;display:block;border-radius:50%;will-change:transform;
  background:radial-gradient(ellipse 50% 50% at 50% 50%,
    var(--fog-a) 0%,var(--fog-a) 26%,var(--fog-b) 52%,transparent 76%);
}
.fogfield i:nth-child(1){width:66vw;height:26vh;left:-20vw;bottom:-5vh;animation:fogA 52s ease-in-out infinite}
.fogfield i:nth-child(2){width:54vw;height:22vh;right:-16vw;bottom:5vh;animation:fogB 68s ease-in-out infinite}
.fogfield i:nth-child(3){width:72vw;height:19vh;left:8vw;bottom:17vh;animation:fogC 84s ease-in-out infinite}
.fogfield i:nth-child(4){width:42vw;height:16vh;right:20vw;bottom:-3vh;animation:fogB 60s ease-in-out infinite reverse}
.fogfield i:nth-child(5){width:58vw;height:15vh;left:-6vw;bottom:28vh;animation:fogA 96s ease-in-out infinite reverse}
@keyframes fogA{0%,100%{transform:translate3d(-5%,0,0) scale(1)}50%{transform:translate3d(7%,-2.4%,0) scale(1.07)}}
@keyframes fogB{0%,100%{transform:translate3d(6%,1%,0) scale(1.04)}50%{transform:translate3d(-7%,-1.6%,0) scale(1)}}
@keyframes fogC{0%,100%{transform:translate3d(-3%,-1%,0) scale(1)}50%{transform:translate3d(5%,2%,0) scale(1.09)}}
h1,h2,h3,h4{margin:0;font-family:var(--serif);font-weight:700;line-height:1.3;color:var(--ink-1);letter-spacing:.01em}
p{margin:0}
ul,ol{margin:0;padding:0;list-style:none}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
img,svg{display:block;max-width:100%}
b,strong{color:var(--ink-1);font-weight:700}
::selection{background:var(--qing);color:#fbf8ef}
:focus-visible{outline:2px solid var(--qing);outline-offset:3px;border-radius:4px}

/* ============================================================
   叁 · 导航
   ============================================================ */
.nav{
  position:fixed;top:0;left:0;right:0;height:var(--nav-h);z-index:50;
  background:color-mix(in srgb,var(--paper) 85%,transparent);
  backdrop-filter:saturate(140%) blur(12px);
  -webkit-backdrop-filter:saturate(140%) blur(12px);
  border-bottom:1px solid transparent;
  transition:border-color var(--t) var(--ease),box-shadow var(--t) var(--ease),background var(--t) var(--ease);
}
.nav.stuck{border-bottom-color:var(--line);box-shadow:0 6px 22px rgba(40,60,70,.09)}
.nav-in{max-width:var(--maxw);margin:0 auto;height:100%;padding:0 26px;display:flex;align-items:center;gap:16px}

.brand{display:flex;align-items:center;gap:11px;flex:0 0 auto}
.brand .mk{
  width:34px;height:34px;flex:0 0 auto;display:grid;place-items:center;border-radius:5px;
  background:linear-gradient(150deg,var(--qing-bright),var(--qing) 46%,var(--lv));
  color:#fbf8ef;font-family:var(--serif);font-size:18px;font-weight:800;transform:rotate(-3deg);
  box-shadow:0 4px 12px var(--qing-a30), inset 0 0 0 1.5px rgba(251,248,239,.32);
}
.brand .bn{font-family:var(--serif);font-size:17px;font-weight:700;color:var(--ink-1);letter-spacing:.12em}
.brand .bt{font-size:10.5px;color:var(--ink-4);font-weight:600;letter-spacing:.26em}

.nav-links{display:flex;align-items:center;gap:1px;margin-left:auto}
.nav-links a{
  position:relative;padding:8px 13px;font-family:var(--serif);font-size:14.5px;font-weight:600;
  color:var(--ink-4);letter-spacing:.06em;transition:color var(--t) var(--ease);
}
.nav-links a:hover{color:var(--ink-1)}
.nav-links a.active{color:var(--qing)}
.nav-links a::after{
  content:"";position:absolute;left:50%;right:50%;bottom:3px;height:1.5px;border-radius:2px;
  background:linear-gradient(90deg,var(--qing),var(--lv));opacity:0;
  transition:left var(--t) var(--ease),right var(--t) var(--ease),opacity var(--t) var(--ease);
}
.nav-links a.active::after{left:13px;right:13px;opacity:1}

.nav-acts{display:flex;align-items:center;gap:8px;flex:0 0 auto}
.iconbtn{
  height:36px;min-width:36px;padding:0;border-radius:6px;display:grid;place-items:center;
  border:1px solid var(--line);background:var(--card);color:var(--ink-3);
  transition:transform var(--t) var(--ease),color var(--t) var(--ease),border-color var(--t) var(--ease),box-shadow var(--t) var(--ease);
}
.iconbtn:hover{color:var(--qing);border-color:var(--qing-a30);transform:translateY(-1px);box-shadow:var(--shadow-sm)}
.iconbtn:active{transform:translateY(0)}
.iconbtn svg{width:17px;height:17px}
.btn-print{width:auto;padding:0 14px;gap:7px;font-family:var(--serif);font-size:13.5px;font-weight:700;letter-spacing:.08em;display:flex;align-items:center}
.nav-toggle{display:none}

/* ============================================================
   肆 · 卷首（Hero）
   ============================================================ */
.hero{position:relative;padding:calc(var(--nav-h) + 50px) 0 clamp(110px,22vw,300px);overflow:hidden}

/* 淡墨晕染（青、绿、墨三团） */
.wash{position:absolute;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.wash i{position:absolute;display:block;border-radius:50%;filter:blur(40px)}
.wash i:nth-child(1){width:520px;height:420px;left:-7%;top:-130px;background:radial-gradient(circle,var(--wash-1),transparent 70%)}
.wash i:nth-child(2){width:470px;height:400px;right:-5%;top:-100px;background:radial-gradient(circle,var(--wash-3),transparent 70%)}
.wash i:nth-child(3){width:360px;height:300px;left:42%;top:40px;background:radial-gradient(circle,var(--wash-2),transparent 70%)}

/* 千里江山 —— 主山水长卷 */
.shan{
  position:absolute;left:0;right:0;bottom:0;z-index:0;pointer-events:none;
  height:clamp(96px,20.8vw,300px);
}
.shan svg{width:100%;height:100%}
/* 顶部化入绢色，如云气遮断山腰 */
.shan::before{
  content:"";position:absolute;left:0;right:0;top:-2px;height:46%;z-index:1;pointer-events:none;
  background:linear-gradient(to bottom,var(--paper) 0%,color-mix(in srgb,var(--paper) 55%,transparent) 46%,transparent 100%);
}

.scroll{
  position:relative;z-index:2;border:1px solid var(--line);border-radius:var(--r-lg);
  background:linear-gradient(168deg,var(--card) 0%,var(--card-2) 100%);
  box-shadow:var(--shadow);overflow:hidden;
}
/* 手卷天头地脚：青绿绫绢，内衬一线赭石打底 */
.scroll::before,.scroll::after{
  content:"";position:absolute;left:0;right:0;height:9px;z-index:3;pointer-events:none;
  background:linear-gradient(90deg,var(--qing-deep),var(--qing) 16%,var(--lv) 50%,var(--qing) 84%,var(--qing-deep));
  opacity:.72;
}
.scroll::before{top:0;box-shadow:inset 0 -1.5px 0 color-mix(in srgb,var(--zhe) 46%,transparent)}
.scroll::after{bottom:0;box-shadow:inset 0 1.5px 0 color-mix(in srgb,var(--zhe) 46%,transparent)}

/* 卷内青绿山影（点缀） */
.card-shan{position:absolute;right:0;top:9px;width:min(52%,540px);z-index:0;pointer-events:none;opacity:.9}
.card-shan svg{width:100%;height:auto}

.scroll-in{position:relative;z-index:1;padding:46px 46px 38px;display:grid;grid-template-columns:auto 1fr;gap:38px;align-items:start}

/* 竖排列名 + 青花印 */
.side{display:flex;flex-direction:column;align-items:center;gap:20px;padding-top:6px;position:relative;z-index:1}
.vname{
  writing-mode:vertical-rl;text-orientation:upright;
  font-family:var(--serif);font-size:22px;font-weight:700;letter-spacing:.42em;
  color:var(--ink-1);padding:6px 2px;
  border-left:1px solid var(--line);border-right:1px solid var(--line);
}
.seal{
  width:70px;height:70px;display:grid;place-items:center;border-radius:6px;position:relative;flex:0 0 auto;
  background:linear-gradient(150deg,var(--qing),var(--qing-deep));color:#fbf8ef;
  font-family:var(--serif);font-size:32px;font-weight:800;line-height:1;transform:rotate(-4deg);
  box-shadow:0 8px 22px var(--qing-a30), inset 0 0 0 2.5px rgba(251,248,239,.34);
}
/* 印面斑驳（金石味） */
.seal::after{
  content:"";position:absolute;inset:0;border-radius:6px;pointer-events:none;
  background-image:
    radial-gradient(circle at 22% 30%,rgba(251,248,239,.44) 0 1.4px,transparent 2px),
    radial-gradient(circle at 68% 22%,rgba(251,248,239,.36) 0 1.1px,transparent 1.8px),
    radial-gradient(circle at 40% 76%,rgba(251,248,239,.32) 0 1.6px,transparent 2.4px),
    radial-gradient(circle at 82% 66%,rgba(251,248,239,.38) 0 1.2px,transparent 2px),
    radial-gradient(circle at 58% 52%,rgba(251,248,239,.24) 0 2px,transparent 3px);
  mix-blend-mode:screen;opacity:.78;
}
.side .sdate{writing-mode:vertical-rl;font-family:var(--kai);font-size:12.5px;letter-spacing:.24em;color:var(--ink-4)}

.hero-main{min-width:0;position:relative;z-index:1}
.motto{
  font-family:var(--kai);font-size:16px;color:var(--qing);letter-spacing:.14em;
  display:inline-flex;align-items:center;gap:10px;margin-bottom:14px;
}
.motto::before,.motto::after{content:"";height:1px;width:26px;background:linear-gradient(90deg,transparent,var(--qing-a30))}
.motto::after{background:linear-gradient(90deg,var(--qing-a30),transparent)}
.hero-main h1{font-size:clamp(38px,6.2vw,60px);letter-spacing:.06em;line-height:1.14}
.hero-main h1 .en{display:block;font-size:.3em;font-weight:600;letter-spacing:.24em;color:var(--ink-4);margin-top:12px;font-family:var(--serif)}

.roles{display:flex;flex-wrap:wrap;gap:9px;margin-top:20px}
.role{
  display:inline-flex;align-items:center;gap:7px;padding:5px 13px;border-radius:4px;
  font-family:var(--serif);font-size:13px;font-weight:700;letter-spacing:.06em;
  border:1px solid var(--line);background:var(--card);color:var(--ink-3);
}
.role.key{
  color:#fbf8ef;border-color:transparent;
  background:linear-gradient(135deg,var(--qing),var(--qing-deep));
  box-shadow:0 5px 14px var(--qing-a30);
}
.role.green{color:var(--lv-deep);border-color:var(--lv-a26);background:var(--lv-a10)}
html[data-theme="dark"] .role.green{color:var(--lv-bright)}
.role .dotp{width:6px;height:6px;border-radius:50%;background:currentColor;box-shadow:0 0 0 3px color-mix(in srgb,currentColor 24%,transparent)}

.sum{
  margin-top:22px;font-size:15.4px;line-height:1.98;color:var(--ink-3);max-width:76ch;
  padding-left:18px;border-left:2px solid var(--line);position:relative;
}
.sum::before{
  content:"";position:absolute;left:-2px;top:0;width:2px;height:46px;
  background:linear-gradient(180deg,var(--qing),var(--lv-a26));
}
.sum b{color:var(--ink-1)}

.kw{display:flex;flex-wrap:wrap;gap:8px;margin-top:24px}
.kw span{
  font-family:var(--serif);font-size:12.6px;font-weight:600;letter-spacing:.08em;
  padding:5px 12px;border-radius:3px;color:var(--ink-3);
  background:var(--qing-a07);border:1px solid var(--line-soft);
  transition:transform var(--t) var(--ease),color var(--t) var(--ease),border-color var(--t) var(--ease),box-shadow var(--t) var(--ease);
}
.kw span:hover{transform:translateY(-2px);color:var(--qing);border-color:var(--qing-a30);box-shadow:var(--shadow-sm)}
.kw span:nth-child(3n){color:var(--lv-deep);border-color:var(--lv-a26);background:var(--lv-a10)}
html[data-theme="dark"] .kw span:nth-child(3n){color:var(--lv-bright)}
.kw span:nth-child(3n):hover{color:var(--lv-deep);border-color:var(--lv)}
html[data-theme="dark"] .kw span:nth-child(3n):hover{color:var(--lv-bright)}

.cta{display:flex;flex-wrap:wrap;gap:10px;margin-top:28px}
.btn{
  display:inline-flex;align-items:center;gap:9px;padding:11px 20px;border-radius:5px;
  font-family:var(--serif);font-size:14px;font-weight:700;letter-spacing:.06em;
  border:1px solid var(--line);background:var(--card);color:var(--ink-2);
  transition:transform var(--t) var(--ease),box-shadow var(--t) var(--ease),border-color var(--t) var(--ease),color var(--t) var(--ease);
}
.btn svg{width:16px;height:16px;flex:0 0 auto}
.btn:hover{transform:translateY(-2px);box-shadow:var(--shadow);border-color:var(--qing-a30);color:var(--ink-1)}
.btn.primary{
  background:linear-gradient(135deg,var(--qing),var(--qing-deep));color:#fbf8ef;border-color:transparent;
  box-shadow:0 8px 20px var(--qing-a30);
}
.btn.primary:hover{color:#fbf8ef;box-shadow:0 14px 30px var(--qing-a30)}
.btn.green{border-color:var(--lv-a26);background:var(--lv-a10);color:var(--lv-deep)}
html[data-theme="dark"] .btn.green{color:var(--lv-bright)}
.btn.green:hover{border-color:var(--lv);color:var(--lv-deep)}
html[data-theme="dark"] .btn.green:hover{color:var(--lv-bright)}
.btn .val{font-family:var(--sans);font-weight:500;font-size:13px;color:var(--ink-4);letter-spacing:.02em}
.btn.primary .val{color:rgba(251,248,239,.84)}

.hero-meta{
  display:flex;flex-wrap:wrap;gap:9px 24px;margin-top:28px;padding-top:22px;
  border-top:1px solid var(--line-soft);font-size:13px;color:var(--ink-4);
}
.hero-meta span{display:inline-flex;align-items:center;gap:8px;font-family:var(--serif);letter-spacing:.04em}
.hero-meta svg{width:14px;height:14px;color:var(--qing);flex:0 0 auto}

/* ============================================================
   伍 · 区块通用
   ============================================================ */
.sec{padding:76px 0 0;position:relative}
.sec-head{display:flex;align-items:flex-end;gap:18px;margin-bottom:34px;flex-wrap:wrap;position:relative}
.sec-head::after{
  content:"";position:absolute;left:0;right:0;bottom:-15px;height:1px;
  background:linear-gradient(90deg,var(--qing-a30),var(--lv-a26) 14%,var(--line) 42%,var(--line-soft) 70%,transparent);
}
.sec-idx{
  font-family:var(--serif);font-size:15px;font-weight:800;color:#fbf8ef;
  width:34px;height:34px;display:grid;place-items:center;border-radius:5px;flex:0 0 auto;
  background:linear-gradient(165deg,var(--qing-bright),var(--qing) 44%,var(--lv));
  box-shadow:0 5px 14px var(--qing-a30), inset 0 0 0 1.5px rgba(251,248,239,.28);
  transform:rotate(-2deg);
}
.sec-head h2{font-size:clamp(23px,3.1vw,30px);letter-spacing:.1em}
.sec-head .sub{font-family:var(--kai);font-size:13.6px;color:var(--ink-4);margin-left:auto;letter-spacing:.08em;max-width:46ch}

.card{
  background:linear-gradient(165deg,var(--card),var(--card-2));
  border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow-sm);
  transition:transform var(--t) var(--ease),box-shadow var(--t) var(--ease),border-color var(--t) var(--ease);
}
.card:hover{transform:translateY(-3px);box-shadow:var(--shadow);border-color:var(--qing-a30)}

/* ============================================================
   陆 · 亮点成果
   ============================================================ */
.hl-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(212px,1fr));gap:18px}
.hl{padding:26px 22px 24px;position:relative;overflow:hidden}
.hl::before{
  content:"";position:absolute;left:0;top:0;bottom:0;width:3px;
  background:linear-gradient(180deg,var(--qing),var(--lv) 58%,transparent);
}
.hl::after{
  content:"";position:absolute;right:-30px;top:-34px;width:96px;height:96px;border-radius:50%;
  background:radial-gradient(circle,var(--wash-3),transparent 68%);pointer-events:none;
}
.hl .num{font-family:var(--serif);font-size:33px;font-weight:800;line-height:1.06;letter-spacing:.02em;color:var(--qing)}
.hl .num small{font-size:14px;font-weight:700;margin-left:3px;color:var(--lv);letter-spacing:.06em}
.hl .num.txt{font-size:25px;letter-spacing:.05em}
.hl h3{font-size:15.4px;margin-top:14px;letter-spacing:.04em}
.hl p{font-size:13.2px;color:var(--ink-4);margin-top:8px;line-height:1.78}
.hl .tag{
  display:inline-block;margin-top:14px;font-family:var(--kai);font-size:11.6px;letter-spacing:.14em;
  padding:3px 10px;border-radius:3px;background:var(--qing-a07);border:1px solid var(--line-soft);color:var(--ink-4);
}

/* ============================================================
   柒 · Tabs（书签式）
   ============================================================ */
.tablist{
  display:flex;gap:4px;padding-left:4px;overflow-x:auto;scrollbar-width:none;
  margin-bottom:-1px;border-bottom:1px solid var(--line);position:relative;z-index:1;
}
.tablist::-webkit-scrollbar{display:none}
.tab{
  position:relative;top:1px;padding:10px 22px 12px;border-radius:7px 7px 0 0;
  font-family:var(--serif);font-size:14.5px;font-weight:700;letter-spacing:.08em;color:var(--ink-4);
  border:1px solid transparent;border-bottom:0;white-space:nowrap;
  transition:color var(--t) var(--ease),background var(--t) var(--ease),border-color var(--t) var(--ease);
}
.tab:hover{color:var(--ink-1)}
.tab[aria-selected="true"]{
  color:var(--qing);background:var(--card);border-color:var(--line);
  box-shadow:0 -3px 12px rgba(40,60,70,.07), inset 0 2px 0 var(--qing);
}
.tab .cnt{
  display:inline-grid;place-items:center;min-width:19px;height:19px;padding:0 5px;margin-left:8px;
  border-radius:3px;font-family:var(--sans);font-size:11px;font-weight:800;
  background:var(--paper-2);border:1px solid var(--line-soft);color:var(--ink-4);
}
.tab[aria-selected="true"] .cnt{background:var(--qing-a07);border-color:var(--qing-a30);color:var(--qing)}
.panel{
  border:1px solid var(--line);border-radius:0 var(--r) var(--r) var(--r);
  background:color-mix(in srgb,var(--card) 46%,transparent);
  padding:28px 26px;animation:inkfade .34s var(--ease) both;
}
.panel[hidden]{display:none}
@keyframes inkfade{from{opacity:0;transform:translateY(8px);filter:blur(2px)}to{opacity:1;transform:none;filter:blur(0)}}

/* 时间线 */
.tl{position:relative;padding-left:30px}
.tl::before{
  content:"";position:absolute;left:6px;top:10px;bottom:10px;width:2px;border-radius:2px;
  background:linear-gradient(180deg,var(--qing),var(--lv) 44%,var(--line) 84%,transparent);
}
.tl-item{position:relative;padding-bottom:28px}
.tl-item:last-child{padding-bottom:0}
.tl-item::before{
  content:"";position:absolute;left:-30px;top:9px;width:14px;height:14px;border-radius:50%;
  background:var(--card);border:3px solid var(--qing);box-shadow:0 0 0 4px var(--qing-a07);
}
.tl-top{display:flex;flex-wrap:wrap;align-items:baseline;gap:12px}
.tl-item h3{font-size:17.4px;letter-spacing:.03em}
.tl-item .org{font-family:var(--serif);font-size:14px;font-weight:700;color:var(--lv);margin-top:5px;letter-spacing:.05em}
html[data-theme="dark"] .tl-item .org{color:var(--lv-bright)}
.tl-item .when{
  margin-left:auto;font-family:var(--kai);font-size:12.4px;font-weight:600;color:var(--ink-4);
  padding:3px 11px;border-radius:3px;background:var(--paper-2);border:1px solid var(--line-soft);
  white-space:nowrap;letter-spacing:.1em;display:inline-flex;align-items:center;gap:6px;
}
.tl-item .when svg{width:12px;height:12px}
.tl-item ul{margin-top:13px;display:grid;gap:9px}
.tl-item li{position:relative;padding-left:20px;font-size:14.4px;color:var(--ink-3);line-height:1.84}
.tl-item li::before{
  content:"";position:absolute;left:2px;top:.72em;width:7px;height:7px;background:var(--qing);opacity:.68;
  clip-path:polygon(50% 0,100% 38%,82% 100%,18% 100%,0 38%);
}
.tl-item li b{color:var(--ink-1)}

/* 项目卡片 */
.pj-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:20px}
.pj{padding:26px 24px;display:flex;flex-direction:column;gap:13px;height:100%;position:relative;overflow:hidden}
.pj::after{
  content:"";position:absolute;right:-34px;bottom:-44px;width:140px;height:140px;border-radius:50%;
  background:radial-gradient(circle,var(--wash-1),transparent 68%);pointer-events:none;
}
.pj-head{display:flex;align-items:flex-start;gap:15px;position:relative;z-index:1}
.pj-ico{
  width:46px;height:46px;border-radius:8px;flex:0 0 auto;display:grid;place-items:center;
  background:linear-gradient(150deg,var(--qing-a14),var(--lv-a10));color:var(--qing);
  border:1px solid var(--qing-a14);
}
html[data-theme="dark"] .pj-ico{color:var(--qing-bright)}
.pj-ico svg{width:23px;height:23px}
.pj h3{font-size:17px;line-height:1.5;letter-spacing:.03em}
.pj-sub{font-family:var(--serif);font-size:12.6px;color:var(--ink-4);margin-top:7px;display:flex;flex-wrap:wrap;gap:5px 14px;letter-spacing:.06em}
.pj-sub b{color:var(--lv);font-weight:700}
html[data-theme="dark"] .pj-sub b{color:var(--lv-bright)}
.pj p.desc{font-size:14.2px;color:var(--ink-3);line-height:1.84;position:relative;z-index:1}
.pj ul.res{display:grid;gap:9px;position:relative;z-index:1}
.pj ul.res li{position:relative;padding-left:22px;font-size:13.9px;color:var(--ink-3);line-height:1.8}
.pj ul.res li::before{
  content:"印";position:absolute;left:0;top:.24em;width:15px;height:15px;border-radius:3px;
  display:grid;place-items:center;font-family:var(--serif);font-size:9.5px;font-weight:800;
  background:var(--qing-a07);color:var(--qing);border:1px solid var(--qing-a14);
}
.pj ul.res li b{color:var(--ink-1)}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:auto;padding-top:16px;position:relative;z-index:1}
.chips span{
  font-family:var(--serif);font-size:11.6px;font-weight:600;letter-spacing:.06em;padding:4px 10px;border-radius:3px;
  background:var(--paper-2);border:1px solid var(--line-soft);color:var(--ink-4);
}
.pj-link{
  display:inline-flex;align-items:center;gap:7px;font-family:var(--serif);font-size:13.2px;font-weight:700;
  color:var(--qing);margin-top:13px;letter-spacing:.06em;transition:gap var(--t) var(--ease);position:relative;z-index:1;
}
.pj-link:hover{gap:11px}
.pj-link svg{width:15px;height:15px}

/* ============================================================
   捌 · 技能矩阵（青绿墨条）
   ============================================================ */
.sk-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:20px}
.sk-card{padding:26px 24px}
.sk-card h3{font-size:15.6px;display:flex;align-items:center;gap:10px;margin-bottom:20px;letter-spacing:.08em}
.sk-card h3 .sq{
  width:10px;height:10px;transform:rotate(45deg);flex:0 0 auto;
  background:linear-gradient(140deg,var(--qing),var(--lv));box-shadow:0 0 0 3px var(--qing-a07);
}
.sk-row{margin-bottom:17px}
.sk-row:last-child{margin-bottom:0}
.sk-lb{display:flex;justify-content:space-between;align-items:baseline;gap:12px;font-size:13.6px;margin-bottom:8px}
.sk-lb b{font-weight:500;color:var(--ink-2);font-family:var(--serif);letter-spacing:.04em}
.sk-lb i{font-style:normal;font-family:var(--serif);font-size:11.6px;font-weight:800;color:var(--qing);letter-spacing:.06em}
.bar{height:8px;border-radius:2px;background:var(--paper-2);border:1px solid var(--line-soft);overflow:hidden;position:relative}
.bar span{
  display:block;height:100%;width:0;border-radius:2px;position:relative;
  background:linear-gradient(90deg,var(--qing-bright),var(--qing) 42%,var(--lv) 100%);
  transition:width 1000ms var(--ease);
}
/* 山脊墨线收锋 */
.bar span::after{content:"";position:absolute;right:0;top:0;bottom:0;width:4px;background:var(--ink-1);opacity:.5}
.sk-note{
  margin-top:20px;font-family:var(--kai);font-size:13px;color:var(--ink-4);letter-spacing:.05em;
  padding:14px 18px;border-radius:var(--r-sm);background:var(--card-2);
  border:1px dashed var(--line);border-left:2px solid var(--lv-a26);
}

/* ============================================================
   玖 · 教育与证书
   ============================================================ */
.edu-grid{display:grid;grid-template-columns:1.06fr 1fr;gap:20px;align-items:start}
.edu-card{padding:28px 26px;display:flex;gap:18px;position:relative;overflow:hidden}
.edu-card::after{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:linear-gradient(180deg,var(--qing),var(--lv) 66%,transparent)}
.edu-ico{
  width:54px;height:54px;border-radius:9px;flex:0 0 auto;display:grid;place-items:center;
  background:linear-gradient(150deg,var(--qing-deep),var(--qing) 46%,var(--lv));color:#fbf8ef;
  box-shadow:0 10px 22px var(--qing-a30);
}
.edu-ico svg{width:27px;height:27px}
.edu-card h3{font-size:19.5px;letter-spacing:.06em}
.edu-sub{font-family:var(--serif);font-size:14px;color:var(--lv);font-weight:700;margin-top:7px;letter-spacing:.05em}
html[data-theme="dark"] .edu-sub{color:var(--lv-bright)}
.edu-meta{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.edu-meta span{
  font-family:var(--kai);font-size:12.2px;padding:3px 11px;border-radius:3px;letter-spacing:.1em;
  background:var(--qing-a07);border:1px solid var(--line-soft);color:var(--ink-4);
}
.edu-desc{font-size:13.8px;color:var(--ink-4);margin-top:14px;line-height:1.84}

.cert-list{display:grid;gap:13px}
.cert{
  display:flex;align-items:center;gap:15px;padding:17px 19px;border-radius:var(--r);
  background:linear-gradient(150deg,var(--card),var(--card-2));
  border:1px solid var(--line);box-shadow:var(--shadow-sm);position:relative;overflow:hidden;
  transition:transform var(--t) var(--ease),box-shadow var(--t) var(--ease),border-color var(--t) var(--ease);
}
.cert::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:linear-gradient(180deg,var(--qing),var(--lv));opacity:.8}
.cert:hover{transform:translateY(-2px);box-shadow:var(--shadow);border-color:var(--qing-a30)}
.cert .medal{
  width:40px;height:40px;border-radius:7px;flex:0 0 auto;display:grid;place-items:center;
  background:var(--qing-a07);color:var(--qing);border:1px solid var(--qing-a14);
}
html[data-theme="dark"] .cert .medal{color:var(--qing-bright)}
.cert .medal svg{width:21px;height:21px}
.cert .ct{flex:1 1 auto;min-width:0}
.cert h4{font-family:var(--serif);font-size:14.6px;line-height:1.56;letter-spacing:.03em}
.cert .ci{font-family:var(--kai);font-size:12.4px;color:var(--ink-4);margin-top:4px;letter-spacing:.08em}
.cert .cd{
  font-family:var(--serif);font-size:12.2px;font-weight:800;color:#fbf8ef;white-space:nowrap;letter-spacing:.08em;
  padding:3px 9px;border-radius:3px;background:linear-gradient(135deg,var(--qing),var(--qing-deep));
}

/* ============================================================
   拾 · 页脚 / 悬浮件
   ============================================================ */
.foot{border-top:1px solid var(--line);margin-top:82px;padding:0 0 52px;background:var(--card-2);position:relative;overflow:hidden}
.foot-shan{position:absolute;left:0;right:0;top:0;height:74px;z-index:0;pointer-events:none;opacity:.85}
.foot-shan svg{width:100%;height:100%}
.foot-in{position:relative;z-index:1;padding-top:56px;display:flex;flex-wrap:wrap;gap:22px;align-items:center;justify-content:space-between}
.foot-l{display:flex;align-items:center;gap:16px}
.foot .fseal{
  width:46px;height:46px;border-radius:5px;display:grid;place-items:center;flex:0 0 auto;
  background:linear-gradient(150deg,var(--qing),var(--qing-deep));color:#fbf8ef;
  font-family:var(--serif);font-size:20px;font-weight:800;transform:rotate(-4deg);
  box-shadow:0 6px 16px var(--qing-a30), inset 0 0 0 2px rgba(251,248,239,.3);
}
.foot p{font-family:var(--serif);font-size:13px;color:var(--ink-4);letter-spacing:.05em;line-height:1.9}
.foot .fl{display:flex;flex-wrap:wrap;gap:8px 20px}
.foot .fl a{font-family:var(--serif);font-size:13.2px;color:var(--ink-4);font-weight:600;letter-spacing:.08em;transition:color var(--t) var(--ease)}
.foot .fl a:hover{color:var(--qing)}

.top{
  position:fixed;right:24px;bottom:24px;z-index:40;width:46px;height:46px;border-radius:7px;
  display:grid;place-items:center;background:var(--card);border:1px solid var(--line);
  box-shadow:var(--shadow);color:var(--qing);
  opacity:0;visibility:hidden;transform:translateY(12px) scale(.94);
  transition:opacity var(--t) var(--ease),transform var(--t) var(--ease),visibility var(--t);
}
.top.show{opacity:1;visibility:visible;transform:none}
.top:hover{transform:translateY(-3px);border-color:var(--qing-a30)}
.top svg{width:19px;height:19px}

.toast{
  position:fixed;left:50%;bottom:34px;z-index:80;transform:translate(-50%,16px);
  padding:12px 22px;border-radius:6px;font-family:var(--serif);font-size:13.6px;font-weight:700;letter-spacing:.06em;
  background:var(--ink-1);color:var(--card);box-shadow:var(--shadow-lg);
  opacity:0;visibility:hidden;transition:opacity var(--t) var(--ease),transform var(--t) var(--ease),visibility var(--t);
  display:flex;align-items:center;gap:10px;max-width:88vw;
}
.toast.show{opacity:1;visibility:visible;transform:translate(-50%,0)}
.toast svg{width:16px;height:16px;color:var(--lv-bright)}

.empty{
  padding:30px;text-align:center;color:var(--ink-4);font-family:var(--kai);font-size:14.5px;letter-spacing:.1em;
  border:1px dashed var(--line);border-radius:var(--r);background:var(--card-2);
}

/* 入场：墨化 */
.reveal{opacity:0;transform:translateY(20px);filter:blur(3px)}
.reveal.in{opacity:1;transform:none;filter:blur(0);transition:opacity 620ms var(--ease),transform 620ms var(--ease),filter 620ms var(--ease)}
.reveal.d1{transition-delay:70ms}.reveal.d2{transition-delay:140ms}.reveal.d3{transition-delay:210ms}.reveal.d4{transition-delay:280ms}

/* ============================================================
   响应式
   ============================================================ */
@media (max-width:960px){
  .edu-grid{grid-template-columns:1fr}
  .card-shan{width:60%;opacity:.6}
}
@media (max-width:820px){
  .scroll-in{grid-template-columns:1fr;gap:26px;padding:38px 28px 32px}
  .side{flex-direction:row;align-items:center;gap:18px;padding:0 0 4px}
  .vname{writing-mode:horizontal-tb;border:0;border-bottom:1px solid var(--line);padding:0 0 6px;font-size:19px;letter-spacing:.3em}
  .side .sdate{writing-mode:horizontal-tb;letter-spacing:.16em}
  .seal{width:60px;height:60px;font-size:27px}
  .card-shan{top:auto;bottom:0;right:0;width:76%;opacity:.4}
}
@media (max-width:760px){
  :root{--nav-h:60px}
  .nav-in,.wrap{padding-left:16px;padding-right:16px}
  .nav-links{
    position:fixed;top:var(--nav-h);left:0;right:0;flex-direction:column;align-items:stretch;gap:2px;
    padding:12px;margin:0 14px;border-radius:var(--r);background:var(--card);
    border:1px solid var(--line);box-shadow:var(--shadow-lg);
    opacity:0;visibility:hidden;transform:translateY(-8px);pointer-events:none;
    transition:opacity var(--t) var(--ease),transform var(--t) var(--ease),visibility var(--t);
  }
  .nav-links.open{opacity:1;visibility:visible;transform:none;pointer-events:auto}
  .nav-links a{padding:12px 14px;font-size:15px}
  .nav-links a::after{display:none}
  .nav-links a.active{background:var(--qing-a07);border-radius:5px}
  .nav-toggle{display:grid}
  .btn-print .lbl{display:none}
  .btn-print{width:36px;padding:0;justify-content:center}
  .brand .bt{display:none}
  .hero{padding-top:calc(var(--nav-h) + 28px);padding-bottom:96px}
  .sec{padding-top:54px}
  .sec-head .sub{margin-left:0;width:100%}
  .sec-head::after{bottom:-12px}
  .tl-item .when{margin-left:0}
  .pj-grid{grid-template-columns:1fr}
  .panel{padding:22px 18px}
  .scroll-in{padding:32px 20px 26px}
  .hero-meta{gap:8px 16px}
  .foot-in{flex-direction:column;align-items:flex-start;padding-top:64px}
}

/* 减弱动效 */
@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{animation-duration:.001ms !important;animation-iteration-count:1 !important;transition-duration:.001ms !important}
  .reveal{opacity:1;transform:none;filter:none}
  .card:hover,.btn:hover,.cert:hover,.top:hover,.kw span:hover{transform:none}
  .fogfield i{animation:none !important}
}
@media (max-width:760px){
  .fogfield{height:52vh}
  .fogfield i:nth-child(3),.fogfield i:nth-child(5){display:none}
}

/* ============================================================
   打印：绢白底 · 墨色正文 · 青绿存色
   ============================================================ */
@media print{
  :root{
    --paper:#fff;--paper-2:#fff;--card:#fff;--card-2:#fff;
    --ink-1:#000;--ink-2:#1c1c1c;--ink-3:#3a3a3a;--ink-4:#5a5a5a;--ink-5:#8a8a8a;
    --line:#cfc9ba;--line-soft:#ddd7c9;
    --qing:#1f5670;--qing-deep:#1f5670;--qing-bright:#2b6a8c;--lv:#2f6b52;--lv-deep:#2f6b52;--zhe:#7d6429;
    --wash-1:transparent;--wash-2:transparent;--wash-3:transparent;--fibre:transparent;
    --mistCol:#fff;
    --bd-op:.07;--bd-op-d:.07;
    --shA1:#cdd9df;--shA2:#e8ece7;--shB1:#a6bcc7;--shB2:#c2d3ca;
    --shC1:#7ba2b2;--shC2:#9bbcae;--shD1:#4e8299;--shD2:#63967c;--shDetail:#2c3a3c;
  }
  html[data-theme="dark"]{
    --paper:#fff;--paper-2:#fff;--card:#fff;--card-2:#fff;
    --ink-1:#000;--ink-2:#1c1c1c;--ink-3:#3a3a3a;--ink-4:#5a5a5a;--ink-5:#8a8a8a;--line:#cfc9ba;--line-soft:#ddd7c9;
  }
  @page{margin:11mm 10mm}
  body{background:#fff;font-size:10.4pt;line-height:1.56}
  body::before,.wash,.card-shan,.foot-shan,.fogfield,.nav,.top,.toast,.tablist,.no-print{display:none !important}
  .hero{padding:0 0 62pt;position:relative}
  .shan{height:60pt;position:absolute;bottom:0}
  .shan::before{background:linear-gradient(to bottom,#fff,rgba(255,255,255,.5) 46%,transparent)}

const THEME_KEY = "xmz-theme";
const themeBtn = $("#themeBtn"), icoSun = $("#icoSun"), icoMoon = $("#icoMoon");
const systemTheme = () => (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
function applyTheme(t) {
  document.documentElement.setAttribute("data-theme", t);
  icoSun.hidden = t === "dark";
  icoMoon.hidden = t !== "dark";
  themeBtn.setAttribute("aria-label", t === "dark" ? "切换到昼间青绿" : "切换到夜间墨山");
  const mt = $('meta[name="theme-color"]');
  if (mt) mt.setAttribute("content", t === "dark" ? "#0b1014" : "#f1e9d6");
}
let savedTheme = null;
try { savedTheme = localStorage.getItem(THEME_KEY); } catch (e) { savedTheme = null; }
applyTheme(savedTheme === "dark" || savedTheme === "light" ? savedTheme : systemTheme());
themeBtn.addEventListener("click", () => {
  const next = document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark";
  applyTheme(next);
  try { localStorage.setItem(THEME_KEY, next); } catch (e) {}
  toast(next === "dark" ? "已入夜山" : "已归昼山");
});
if (window.matchMedia) {
  window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", (e) => {
    let st = null;
    try { st = localStorage.getItem(THEME_KEY); } catch (err) {}
    if (!st) applyTheme(e.matches ? "dark" : "light");
  });
}

let toastTimer = null;

  const t = $("#toast");
  $("#toastMsg").textContent = msg;
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), 1900);
}
function copyText(text, okMsg) {
  const done = () => toast(okMsg || "已复制到剪贴板");
  const fail = () => toast("复制失败，请手动选择文本复制");
  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(text).then(done).catch(() => (legacyCopy(text) ? done() : fail()));
  } else {
    legacyCopy(text) ? done() : fail();
  }
}
function legacyCopy(text) {
  try {
    const ta = el("textarea");
    ta.value = text;
    ta.setAttribute("readonly", "");
    ta.style.cssText = "position:fixed;top:-1000px;opacity:0";
    document.body.appendChild(ta);
    ta.select();
    const ok = document.execCommand("copy");
    document.body.removeChild(ta);
    return ok;
  } catch (e) { return false; }
}

$("#vName").textContent = M.name;
$("#sealBox").textContent = M.seal || initial;
$("#footSeal").textContent = M.seal || initial;
$("#sideDate").textContent = M.dateShort || "";
$("#motto").textContent = M.motto || "";
if (!M.motto) $("#motto").remove();

(function renderRole() {
  const box = $("#heroRole");
  if (M.role) box.appendChild(el("span", "role green", '<span class="dotp"></span>' + esc(M.role)));
  if (M.roleSub) box.appendChild(el("span", "role key", esc(M.roleSub)));
  if (M.status) box.appendChild(el("span", "role", esc(M.status)));

$("#heroSum").innerHTML = M.summary || "";

(function renderKeywords() {
  const box = $("#heroKw");
  (M.keywords || []).forEach((k) => box.appendChild(el("span", null, esc(k))));
  if (!box.children.length) box.remove();

/* 联系方式（邮箱/微信分片存储，运行时拼接以防爬虫） */
(function renderContact() {
  const cta = $("#heroCta"), meta = $("#heroMeta");
  (resume.contact || []).forEach((c) => {
    const val = c.value || (c.parts ? c.parts.join("") : "");
    if (!val) return;
    if (c.type === "location") { meta.appendChild(el("span", null, svg("pin") + esc(val))); return; }
    const iconName = { phone: "phone", email: "mail", wechat: "wechat" }[c.type] || "spark";

    if (c.type === "phone" && c.href) {
      const a = el("a", "btn primary", svg(iconName) + "<span>" + esc(c.label) + '</span><span class="val">' + esc(val) + "</span>");
      a.href = c.href;
      cta.appendChild(a);
    } else {
      const b = el("button", "btn" + (c.style ? " " + c.style : ""), svg(iconName) + "<span>" + esc(c.label) + '</span><span class="val">' + esc(val) + "</span>");
      b.type = "button";
      b.setAttribute("aria-label", "复制" + c.label + " " + val);
      b.addEventListener("click", () => copyText(val, c.label + "已复制：" + val));
      cta.appendChild(b);
    }
    meta.appendChild(el("span", null, svg(iconName) + esc(c.label) + "：" + esc(val)));
  });
  if (!meta.children.length) meta.remove();
})();

/* 语言切换：仅在提供双语数据时出现 */
(function renderLang() {
  if (!(M.i18n && (M.i18n.en || M.i18n.zh))) { $("#langBtn").remove(); return; }
  const btn = $("#langBtn");
  btn.hidden = false;
  let lang = "zh";
  btn.addEventListener("click", () => {
    lang = lang === "zh" ? "en" : "zh";
    document.documentElement.lang = lang === "zh" ? "zh-CN" : "en";
    toast(lang === "zh" ? "已切换到中文" : "Switched to English");
  });
})();

/* ============================================================

(function renderHighlights() {
  const grid = $("#hlGrid"), list = resume.highlights || [];
  if (!list.length) { $("#highlights").remove(); return; }

/* ============================================================
   Tabs（ARIA + 键盘 ← → / Home / End）
   ============================================================ */
function mountTabs(mount, groups, renderItems) {
  const valid = (groups || []).filter((g) => g && g.items && g.items.length);
  if (!valid.length) return false;

  const box = el("div", "tabs");
  const uid = "tb" + Math.random().toString(36).slice(2, 8);
  const list = el("div", "tablist");
  list.setAttribute("role", "tablist");
  list.setAttribute("aria-label", mount.getAttribute("aria-label") || "内容分类");
  box.appendChild(list);

  const panels = [];
  valid.forEach((g, i) => {
    const id = uid + "-" + i;
    const t = el("button", "tab", esc(g.cat) + '<span class="cnt">' + g.items.length + "</span>");
    t.type = "button";
    t.id = id + "-tab";
    t.setAttribute("role", "tab");
    t.setAttribute("aria-selected", i === 0 ? "true" : "false");
    t.setAttribute("aria-controls", id + "-panel");
    t.tabIndex = i === 0 ? 0 : -1;
    list.appendChild(t);

    const p = el("div", "panel");
    p.id = id + "-panel";
    p.setAttribute("role", "tabpanel");
    p.setAttribute("aria-labelledby", t.id);
    p.tabIndex = 0;
    if (i !== 0) p.hidden = true;
    renderItems(p, g.items);
    box.appendChild(p);
    panels.push({ tab: t, panel: p });
  });

  function select(i, focus) {
    panels.forEach((o, j) => {
      const on = j === i;
      o.tab.setAttribute("aria-selected", on ? "true" : "false");
      o.tab.tabIndex = on ? 0 : -1;
      o.panel.hidden = !on;
      if (on && focus) o.tab.focus();
    });
  }
  panels.forEach((o, i) => {
    o.tab.addEventListener("click", () => select(i, false));
    o.tab.addEventListener("keydown", (e) => {
      const n = panels.length;
      let next = null;
      if (e.key === "ArrowRight" || e.key === "ArrowDown") next = (i + 1) % n;
      else if (e.key === "ArrowLeft" || e.key === "ArrowUp") next = (i - 1 + n) % n;
      else if (e.key === "Home") next = 0;
      else if (e.key === "End") next = n - 1;
      if (next !== null) { e.preventDefault(); select(next, true); }
    });
  });

  mount.appendChild(box);
  return true;
}

/* 贰 · 经历（时间线） */
(function renderExperience() {
  const mount = $("#expMount");
  mount.setAttribute("aria-label", "经历分类");
  const ok = mountTabs(mount, resume.experience, (panel, items) => {
    const tl = el("div", "tl");
    items.forEach((it) => {
      const node = el("div", "tl-item");
      node.innerHTML =
        '<div class="tl-top"><h3>' + esc(it.title) + "</h3>" +
        (it.when ? '<span class="when">' + svg("clock") + esc(it.when) + "</span>" : "") + "</div>" +
        (it.org ? '<div class="org">' + esc(it.org) + "</div>" : "") +
        (it.points && it.points.length ? "<ul>" + it.points.map((p) => "<li>" + p + "</li>").join("") + "</ul>" : "");
      tl.appendChild(node);
    });
    panel.appendChild(tl);
  });
  if (!ok) mount.appendChild(el("div", "empty", "暂无该类别经历。"));
})();

      c.innerHTML =
        '<div class="pj-head"><span class="pj-ico">' + svg(p.icon || "spark") + "</span>" +
        "<div><h3>" + esc(p.name) + "</h3>" +
        '<div class="pj-sub">' +
        (p.role ? "<span>" + esc(p.role) + "</span>" : "") +
        (p.when ? "<span><b>" + esc(p.when) + "</b></span>" : "") +
        "</div></div></div>" +
        (p.desc ? '<p class="desc">' + esc(p.desc) + "</p>" : "") +

        (p.stack && p.stack.length ? '<div class="chips">' + p.stack.map((s) => "<span>" + esc(s) + "</span>").join("") + "</div>" : "") +
        (p.link ? '<a class="pj-link" href="' + esc(p.link) + '" target="_blank" rel="noopener noreferrer">查看项目 ' + svg("arrow") + "</a>" : "");

/* 肆 · 技能矩阵 */
(function renderSkills() {
  const grid = $("#skGrid"), groups = resume.skills || [];

  groups.forEach((g, gi) => {
    const c = el("div", "card sk-card reveal d" + ((gi % 4) + 1));
    c.innerHTML = "<h3><span class='sq'></span>" + esc(g.group) + "</h3>";
    (g.items || []).forEach((s) => {
      const lv = Math.max(0, Math.min(100, Number(s.level) || 0));
      const row = el("div", "sk-row");
      row.innerHTML =
        '<div class="sk-lb"><b>' + esc(s.label) + "</b><i>" + lv + "%</i></div>" +
        '<div class="bar" role="img" aria-label="' + esc(s.label) + " 熟练度 " + lv + '%"><span data-w="' + lv + '"></span></div>';

/* ============================================================
   导航：锚点 / 滚动高亮 / 移动菜单 / 吸顶
   ============================================================ */
(function renderNav() {
  const links = $("#navLinks");
  const secs = $$("main section[id], footer[id]").filter((s) => s.id !== "top");
  const names = { overview: "卷首", highlights: "亮点", experience: "经历", projects: "项目", skills: "技能", education: "教育证书", contact: "联系" };
  secs.forEach((s) => {
    if (s.getBoundingClientRect().height === 0 && !s.offsetParent) return;
    const a = el("a", null, esc(names[s.id] || s.id));
    a.href = "#" + s.id;
    a.dataset.target = s.id;
    links.appendChild(a);
  });
  $("#footLinks").innerHTML = links.innerHTML;
  $$("#footLinks a").forEach((a) => a.removeAttribute("data-target"));

  /* 区块序号自动重排（模块隐藏后仍连续） */
  const CN = ["壹", "贰", "叁", "肆", "伍", "陆", "柒", "捌"];
  $$(".sec").forEach((s, i) => {
    const idx = $(".sec-idx", s);
    if (idx) idx.textContent = CN[i] || String(i + 1);
  });

  const navA = $$("#navLinks a");
  const navH = () => parseInt(getComputedStyle(document.documentElement).getPropertyValue("--nav-h")) || 66;
  function spy() {
    const y = window.scrollY + navH() + 100;
    let cur = navA.length ? navA[0].dataset.target : null;
    secs.forEach((s) => { if (s.offsetTop <= y) cur = s.id; });
    navA.forEach((a) => a.classList.toggle("active", a.dataset.target === cur));
  }

  const nav = $("#nav"), toTop = $("#toTop");
  function onScroll() {
    const y = window.scrollY;
    nav.classList.toggle("stuck", y > 8);
    toTop.classList.toggle("show", y > 520);
    spy();
  }
  let ticking = false;
  window.addEventListener("scroll", () => {
    if (ticking) return;
    ticking = true;
    requestAnimationFrame(() => { onScroll(); ticking = false; });
  }, { passive: true });
  window.addEventListener("resize", onScroll);
  onScroll();

  toTop.addEventListener("click", () => {
    const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    window.scrollTo({ top: 0, behavior: reduce ? "auto" : "smooth" });
  });

  const tg = $("#navToggle");
  if (tg) {
    const close = () => { links.classList.remove("open"); tg.setAttribute("aria-expanded", "false"); tg.setAttribute("aria-label", "展开导航菜单"); };
    tg.addEventListener("click", () => {
      const open = links.classList.toggle("open");
      tg.setAttribute("aria-expanded", open ? "true" : "false");
      tg.setAttribute("aria-label", open ? "收起导航菜单" : "展开导航菜单");
    });
    links.addEventListener("click", (e) => { if (e.target.tagName === "A") close(); });
    document.addEventListener("click", (e) => { if (!links.contains(e.target) && !tg.contains(e.target)) close(); });
    document.addEventListener("keydown", (e) => { if (e.key === "Escape") close(); });
  }
})();

/* ============================================================
   流动云雾：随滚动淡去
   规则 —— 页面尚有内容藏在屏幕之下时，云雾淡淡遮掩；
           继续下滑，待卷尾抵达屏幕中央，云雾完全消散。
   ============================================================ */
(function fogByScroll() {
  const field = $("#fogfield");
  if (!field) return;
  const root = document.documentElement;

  let raf = 0;
  function update() {
    raf = 0;
    const vh = window.innerHeight || 1;
    /* remain：还有多少内容藏在屏幕之下 */
    const remain = document.documentElement.scrollHeight - window.scrollY - vh;
    /* 卷尾抵达屏幕中央（remain = 半屏）时，云雾完全消散 */
    const gone = vh * 0.5;
    const span = vh * 1.15;
    const o = Math.max(0, Math.min(1, (remain - gone) / span));
    root.style.setProperty("--fog-global", o.toFixed(3));
  }
  function onScroll() {
    if (!raf) raf = requestAnimationFrame(update);
  }
  window.addEventListener("scroll", onScroll, { passive: true });
  window.addEventListener("resize", onScroll);
  window.addEventListener("load", onScroll);
  update();
})();

/* ============================================================
   墨化入场 + 进度条填充
   ============================================================ */
(function reveal() {
  const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const bars = $$(".bar span");
  if (reduce || !("IntersectionObserver" in window)) {
    $$(".reveal").forEach((n) => n.classList.add("in"));
    bars.forEach((b) => (b.style.width = b.dataset.w + "%"));
    return;
  }
  const io = new IntersectionObserver((es) => {
    es.forEach((e) => {
      if (!e.isIntersecting) return;
      e.target.classList.add("in");
      io.unobserve(e.target);
    });
  }, { rootMargin: "0px 0px -8% 0px", threshold: 0.08 });
  $$(".reveal").forEach((n) => io.observe(n));

  const io2 = new IntersectionObserver((es) => {
    es.forEach((e) => {
      if (e.isIntersecting) { e.target.style.width = e.target.dataset.w + "%"; io2.unobserve(e.target); }
    });
  }, { threshold: 0.3 });
  bars.forEach((b) => io2.observe(b));
})();

  $$("input,textarea").forEach((n) => n.blur());
